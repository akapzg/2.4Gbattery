name: Build and Release EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build single-file EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "2.4Gbattery" --icon "app.ico" --hidden-import "pystray._win32" --hidden-import "hid" tray_app.py

      - name: Create GitHub Release and Upload EXE
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/2.4Gbattery.exe
          generate_release_notes: true
